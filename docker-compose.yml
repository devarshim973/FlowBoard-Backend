x-service-env: &service-env
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  DB_PASSWORD: ${DB_PASSWORD}
  EUREKA_DEFAULT_ZONE: http://flowboard-server:8761/eureka/

services:
  mysql:
    image: mysql:8.4
    container_name: flowboard-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init-multiple-dbs.sql:/docker-entrypoint-initdb.d/init-multiple-dbs.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - flowboard-net

  redis:
    image: redis:7-alpine
    container_name: flowboard-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - flowboard-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: flowboard-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_HOST_PORT:-5673}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15673}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 60s
      retries: 20
      start_period: 20m
    networks:
      - flowboard-net

  flowboard-server:
    build:
      context: ./flowboard-server
      dockerfile: Dockerfile
    container_name: flowboard-server
    restart: unless-stopped
    ports:
      - "${EUREKA_HOST_PORT:-8761}:8761"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - flowboard-net

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: flowboard-auth-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *service-env
    ports:
      - "${AUTH_SERVICE_HOST_PORT:-18081}:8081"
    depends_on:
      mysql:
        condition: service_healthy
      flowboard-server:
        condition: service_started
    networks:
      - flowboard-net

  notification-service:
    build:
      context: ./notification_service
      dockerfile: Dockerfile
    container_name: flowboard-notification-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *service-env
      SERVICES_AUTH_URL: http://auth-service:8081
      brevo_api_key: ${brevo_api_key:-disabled}
      brevo_sender_mail: ${brevo_sender_mail:-no-reply@flowboard.local}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_ENABLED: "true"
    ports:
      - "${NOTIFICATION_SERVICE_HOST_PORT:-18082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      flowboard-server:
        condition: service_started
    networks:
      - flowboard-net

  comment-service:
    build:
      context: ./comment-service
      dockerfile: Dockerfile
    container_name: flowboard-comment-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *service-env
      SERVICES_AUTH_URL: http://auth-service:8081
      SERVICES_CARD_URL: http://card-service:8087
      SERVICES_NOTIFICATION_URL: http://notification-service:8082
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_ENABLED: "true"
    ports:
      - "${COMMENT_SERVICE_HOST_PORT:-18083}:8083"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      flowboard-server:
        condition: service_started
    networks:
      - flowboard-net

  workspace-service:
    build:
      context: ./workspace-service
      dockerfile: Dockerfile
    container_name: flowboard-workspace-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *service-env
      SERVICES_AUTH_URL: http://auth-service:8081
      SERVICES_PAYMENT_URL: http://payment-service:8089
    ports:
      - "${WORKSPACE_SERVICE_HOST_PORT:-18084}:8084"
    depends_on:
      mysql:
        condition: service_healthy
      flowboard-server:
        condition: service_started
    networks:
      - flowboard-net

  board-service:
    build:
      context: ./board-service
      dockerfile: Dockerfile
    container_name: flowboard-board-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *service-env
      SERVICES_WORKSPACE_URL: http://workspace-service:8084
      SERVICES_AUTH_URL: http://auth-service:8081
    ports:
      - "${BOARD_SERVICE_HOST_PORT:-18085}:8085"
    depends_on:
      mysql:
        condition: service_healthy
      flowboard-server:
        condition: service_started
      workspace-service:
        condition: service_started
    networks:
      - flowboard-net

  list-service:
    build:
      context: ./list-service
      dockerfile: Dockerfile
    container_name: flowboard-list-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *service-env
      SERVICES_WORKSPACE_URL: http://workspace-service:8084
      SERVICES_BOARD_URL: http://board-service:8085
    ports:
      - "${LIST_SERVICE_HOST_PORT:-18086}:8086"
    depends_on:
      mysql:
        condition: service_healthy
      flowboard-server:
        condition: service_started
      workspace-service:
        condition: service_started
      board-service:
        condition: service_started
    networks:
      - flowboard-net

  card-service:
    build:
      context: ./card-service
      dockerfile: Dockerfile
    container_name: flowboard-card-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *service-env
      SERVICES_WORKSPACE_URL: http://workspace-service:8084
      SERVICES_BOARD_URL: http://board-service:8085
      SERVICES_LIST_URL: http://list-service:8086
      SERVICES_NOTIFICATION_URL: http://notification-service:8082
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_ENABLED: "true"
    ports:
      - "${CARD_SERVICE_HOST_PORT:-18087}:8087"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      flowboard-server:
        condition: service_started
      workspace-service:
        condition: service_started
      board-service:
        condition: service_started
      list-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks:
      - flowboard-net

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: flowboard-payment-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *service-env
    ports:
      - "${PAYMENT_SERVICE_HOST_PORT:-18089}:8089"
    depends_on:
      mysql:
        condition: service_healthy
      flowboard-server:
        condition: service_started
    networks:
      - flowboard-net

  admin-service:
    build:
      context: ./admin-service
      dockerfile: Dockerfile
    container_name: flowboard-admin-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *service-env
      SERVICES_WORKSPACE_URL: http://workspace-service:8084
      SERVICES_BOARD_URL: http://board-service:8085
    ports:
      - "${ADMIN_SERVICE_HOST_PORT:-18091}:8091"
    depends_on:
      mysql:
        condition: service_healthy
      workspace-service:
        condition: service_started
      board-service:
        condition: service_started
      flowboard-server:
        condition: service_started
    networks:
      - flowboard-net

  flowboard-api-gateway:
    build:
      context: ./flowboard-api-gateway
      dockerfile: Dockerfile
    container_name: flowboard-api-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      EUREKA_DEFAULT_ZONE: http://flowboard-server:8761/eureka/
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    ports:
      - "${API_GATEWAY_HOST_PORT:-18080}:8080"
    depends_on:
      redis:
        condition: service_healthy
      flowboard-server:
        condition: service_started
      auth-service:
        condition: service_started
      notification-service:
        condition: service_started
      comment-service:
        condition: service_started
      workspace-service:
        condition: service_started
      board-service:
        condition: service_started
      list-service:
        condition: service_started
      card-service:
        condition: service_started
      payment-service:
        condition: service_started
      admin-service:
        condition: service_started
    networks:
      - flowboard-net

volumes:
  mysql_data:
  redis_data:

networks:
  flowboard-net:
    driver: bridge
