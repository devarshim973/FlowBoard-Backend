server:
  port: 8091

spring:
  application:
    name: admin-service

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/flow_board_auth_service_db
    username: root
    password: ${db_password:${DB_PASSWORD:root}}

  jpa:
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

security:
  jwt:
    secret: ${jwt_secret_key:${JWT_SECRET_KEY}}

admin:
  email: devarshim973@gmail.com
  password: Devarshi@1

services:
  workspace:
    url: ${workspace_service_url:${WORKSPACE_SERVICE_URL:http://localhost:8084}}
  board:
    url: ${board_service_url:${BOARD_SERVICE_URL:http://localhost:8085}}

eureka:
  client:
    service-url:
      defaultZone: ${eureka_default_zone:${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
