server:
  port: 8089

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:mysql://localhost:3306/flow_board_payment_service_db
    username: root
    password: ${db_password:root}

  jpa:
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  currency: INR
  workspace-upgrade-amount: 49900
  workspace-upgrade-name: FlowBoard Pro
